version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pathsync
      POSTGRES_PASSWORD: pathsync_password
      POSTGRES_DB: pathsync_default
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservices
      args:
        SERVICE_NAME: auth-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgres://pathsync:pathsync_password@db:5432/auth_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  application-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservices
      args:
        SERVICE_NAME: application-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgres://pathsync:pathsync_password@db:5432/application_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  document-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservices
      args:
        SERVICE_NAME: document-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgres://pathsync:pathsync_password@db:5432/document_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  university-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservices
      args:
        SERVICE_NAME: university-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgres://pathsync:pathsync_password@db:5432/university_db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  ai-agent-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservices
      args:
        SERVICE_NAME: ai-agent-service
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgres://pathsync:pathsync_password@db:5432/agent_db?sslmode=disable
      # NOTE: Gemini API Key will be read from .env if mapped, or pass it here
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.microservices
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - application-service
      - document-service
      - university-service
      - ai-agent-service

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
